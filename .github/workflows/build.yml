name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 @capacitor/app-launcher@7 @capacitor-community/text-to-speech --legacy-peer-deps
      - run: npx vite build
      - name: Doraemon video
        run: |
          F="$(ls doraemon_listen*.webm 2>/dev/null | sort -V | tail -1)"
          if [ -n "$F" ]; then cp "$F" dist/doraemon_listen.webm; echo "Video: $F"; else echo "Video nahi mili"; fi
      - run: npx cap add android
      - name: Native overlay files and permissions
        run: |
          D=android/app/src/main/java/com/tgmeta/doremonjarvis
          newest() { for f in "$1"*.java; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-; }
          for c in MainActivity JarvisBridge OverlayService ScreenReaderService PhoneActions; do
            F="$(newest $c)"
            echo "Using $F for $c"
            cp "$F" "$D/$c.java"
          done
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/screen_reader_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:canPerformGestures="true"
              android:notificationTimeout="200"
              android:description="@string/app_name" />
          EOF
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="microphone" />\n        <service android:name=".ScreenReaderService" android:exported="true" android:label="Doraemon Screen Reader" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/screen_reader_config" /></service>\n    </application>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DOREMON-JARVIS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
